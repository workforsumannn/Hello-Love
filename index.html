<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0510">
<title>HELLO LOVE — Love Insurance</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0a0510;
  --bg-1: #12081c;
  --panel: rgba(18, 8, 28, 0.85);
  --border: rgba(255, 60, 130, 0.18);
  --border-hi: rgba(255, 60, 130, 0.45);
  --pink: #ff3c82;
  --pink-2: #ff7bac;
  --purple: #b537f2;
  --cyan: #00e5ff;
  --text: #f5e6f0;
  --text-2: #a888a8;
  --text-3: #6b4a6b;
  --mono: 'JetBrains Mono', monospace;
  --disp: 'Orbitron', sans-serif;
  --serif: 'Cormorant Garamond', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100vh;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--mono);
  overflow-x: hidden;
}
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 60, 130, 0.15), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(181, 55, 242, 0.15), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.06), transparent 60%);
}
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 60, 130, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 60, 130, 0.05) 1px, transparent 1px);
  background-size: 50px 50px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 90%);
}
.wrap {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.card {
  position: relative;
  width: 100%; max-width: 420px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 32px 24px 24px;
  backdrop-filter: blur(24px);
  box-shadow: 0 0 60px rgba(255, 60, 130, 0.12), 0 20px 60px rgba(0, 0, 0, 0.6);
  animation: fadeUp 0.6s ease-out;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.card::before, .card::after {
  content: ''; position: absolute;
  width: 22px; height: 22px;
  border: 2px solid var(--pink);
  pointer-events: none;
  filter: drop-shadow(0 0 6px var(--pink));
}
.card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.head { text-align: center; margin-bottom: 24px; }
.heart-logo {
  width: 60px; height: 60px;
  margin: 0 auto 14px;
  color: var(--pink);
  filter: drop-shadow(0 0 16px var(--pink));
  animation: beat 1.5s ease-in-out infinite;
}
@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
.head h1 {
  font-family: var(--disp);
  font-size: 22px; font-weight: 900;
  letter-spacing: 4px;
  color: var(--pink);
  text-shadow: 0 0 16px rgba(255, 60, 130, 0.7);
  line-height: 1;
}
.head h1 span { color: var(--cyan); margin: 0 2px; }
.head p {
  font-size: 9px; color: var(--text-3);
  letter-spacing: 3px; margin-top: 8px;
  font-weight: 600;
}
.divider {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 22px;
}
.divider span {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}
.divider .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--pink);
  box-shadow: 0 0 10px var(--pink);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}
.tabs {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px; margin-bottom: 20px;
  padding: 4px;
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--border);
  border-radius: 4px;
}
.tab-btn {
  padding: 10px;
  background: transparent;
  border: none;
  color: var(--text-3);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.25s;
}
.tab-btn.active {
  background: rgba(255, 60, 130, 0.12);
  color: var(--pink);
  box-shadow: 0 0 15px rgba(255, 60, 130, 0.25), inset 0 0 15px rgba(255, 60, 130, 0.05);
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 9px; color: var(--text-3);
  letter-spacing: 2px; margin-bottom: 7px;
  font-weight: 700;
  text-transform: uppercase;
}
.input-wrap { position: relative; display: flex; align-items: center; }
.input-icon {
  position: absolute; left: 12px;
  width: 15px; height: 15px;
  color: var(--pink-2);
  pointer-events: none; z-index: 2;
}
.field input {
  width: 100%;
  padding: 13px 40px 13px 38px;
  background: rgba(255, 60, 130, 0.04);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.5px;
  outline: none;
  transition: all 0.25s;
}
.field input:focus {
  border-color: var(--pink);
  background: rgba(255, 60, 130, 0.08);
  box-shadow: 0 0 0 3px rgba(255, 60, 130, 0.1), 0 0 20px rgba(255, 60, 130, 0.3);
}
.field input::placeholder {
  color: var(--text-3);
  font-style: italic;
  font-size: 12px;
}
.toggle-pass {
  position: absolute; right: 8px;
  width: 30px; height: 30px;
  background: transparent; border: none;
  color: var(--text-3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px;
  z-index: 2;
}
.toggle-pass svg { width: 15px; height: 15px; }
.btn-main {
  position: relative;
  width: 100%;
  padding: 14px;
  margin-top: 6px;
  border-radius: 5px;
  background: linear-gradient(135deg, rgba(255, 60, 130, 0.15), rgba(181, 55, 242, 0.1));
  border: 1px solid var(--pink);
  color: var(--pink);
  font-family: var(--disp);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 3px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
  overflow: hidden;
  transition: all 0.3s;
  box-shadow: 0 0 25px rgba(255, 60, 130, 0.2), inset 0 0 25px rgba(255, 60, 130, 0.04);
  touch-action: manipulation;
}
.btn-main svg { width: 14px; height: 14px; }
.btn-main:hover:not(:disabled) {
  background: var(--pink);
  color: var(--bg-0);
  box-shadow: 0 0 40px var(--pink);
}
.btn-main:active:not(:disabled) { transform: scale(0.98); }
.btn-main:disabled { opacity: 0.4; cursor: not-allowed; }
.scan {
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 60, 130, 0.6), transparent);
  animation: scanBtn 3s infinite;
}
@keyframes scanBtn {
  0% { left: -100%; }
  60%, 100% { left: 100%; }
}
.status {
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  margin-top: 16px;
  padding: 9px 12px;
  background: rgba(255, 60, 130, 0.04);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 9.5px;
  letter-spacing: 2px;
  color: var(--text-2);
  font-weight: 600;
  transition: all 0.3s;
}
.status .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #ffb400;
  box-shadow: 0 0 6px #ffb400;
  animation: pulse 1.5s infinite;
}
.status.ok {
  color: var(--pink);
  border-color: var(--pink);
  background: rgba(255, 60, 130, 0.08);
}
.status.ok .dot { background: var(--pink); }
.status.err {
  color: #ff2d55;
  border-color: #ff2d55;
  background: rgba(255, 45, 85, 0.08);
}
.status.err .dot { background: #ff2d55; animation: none; }

.form-content { display: none; }
.form-content.active { display: block; animation: fadeIn 0.35s; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(10px); }
  to { opacity: 1; transform: translateX(0); }
}

.footer {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px dashed var(--border);
  font-size: 8.5px;
  color: var(--text-3);
  letter-spacing: 2px;
  text-align: center;
  font-weight: 600;
}
.trial-note {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px;
  padding: 4px 10px;
  background: rgba(0, 229, 255, 0.05);
  border: 1px solid rgba(0, 229, 255, 0.25);
  border-radius: 12px;
  color: var(--cyan);
  font-size: 8.5px;
  letter-spacing: 1.5px;
}
.trial-note .t-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 6px var(--cyan);
  animation: pulse 1.5s infinite;
}
.shake { animation: shakeAnim 0.5s; }
@keyframes shakeAnim {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
@media (max-width: 500px) {
  .wrap { padding: 12px; }
  .card { padding: 26px 18px 20px; }
  .head h1 { font-size: 18px; letter-spacing: 3px; }
  .heart-logo { width: 52px; height: 52px; }
  .field input { padding: 12px 38px 12px 36px; font-size: 13px; }
  .btn-main { padding: 13px; font-size: 11px; letter-spacing: 2px; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div class="wrap">
  <div class="card" id="authCard">

    <div class="head">
      <svg class="heart-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/>
      </svg>
      <h1>HELLO<span>·</span>LOVE</h1>
      <p>LOVE INSURANCE · BETA</p>
    </div>

    <div class="divider">
      <span></span><span class="dot"></span><span></span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin">LOGIN</button>
      <button class="tab-btn" id="tabSignup">SIGN UP</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="form-content active" id="loginForm" autocomplete="off">
      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="loginEmail" placeholder="your@email.com" required/>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="loginPass" placeholder="••••••••" required/>
          <button type="button" class="toggle-pass" onclick="togglePass('loginPass', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-main">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span>LOGIN</span>
        <span class="scan"></span>
      </button>
      <div class="status" id="loginStatus">
        <span class="dot"></span>
        <span id="loginMsg">Enter your credentials</span>
      </div>
    </form>

    <!-- SIGNUP FORM -->
    <form class="form-content" id="signupForm" autocomplete="off">
      <div class="field">
        <label>Full Name</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="signupName" placeholder="Your name" required maxlength="30"/>
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="signupEmail" placeholder="your@email.com" required/>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="signupPass" placeholder="Min 6 characters" required minlength="6"/>
          <button type="button" class="toggle-pass" onclick="togglePass('signupPass', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-main">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <span>CREATE ACCOUNT</span>
        <span class="scan"></span>
      </button>
      <div class="status" id="signupStatus">
        <span class="dot"></span>
        <span id="signupMsg">Start your 30-day free trial</span>
      </div>
    </form>

    <div class="footer">
      <div>SECURE · PRIVATE · FOREVER</div>
      <div class="trial-note">
        <span class="t-dot"></span>
        <span>30 DAYS FREE TRIAL</span>
      </div>
    </div>

  </div>
</div>

<script>
/* ==========================================================
   HELLO LOVE — Auth System
   ========================================================== */

const USERS_KEY = 'hl_users';
const SESSION_KEY = 'hl_session';
const TRIAL_DAYS = 30;

/* ========== HELPERS ========== */
function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveUsers(users) {
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}
function generateToken() {
  const arr = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(arr);
  else for (let i = 0; i < 16; i++) arr[i] = Math.floor(Math.random() * 256);
  return 'HL-' + Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}
function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  const msgEl = document.getElementById(id === 'loginStatus' ? 'loginMsg' : 'signupMsg');
  msgEl.innerText = msg;
  el.classList.remove('ok', 'err');
  if (type) el.classList.add(type);
}
function shakeCard() {
  const card = document.getElementById('authCard');
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 550);
}
function togglePass(inputId, btn) {
  const input = document.getElementById(inputId);
  const isPass = input.type === 'password';
  input.type = isPass ? 'text' : 'password';
  btn.innerHTML = isPass
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ========== TABS ========== */
document.getElementById('tabLogin').addEventListener('click', () => {
  document.getElementById('tabLogin').classList.add('active');
  document.getElementById('tabSignup').classList.remove('active');
  document.getElementById('loginForm').classList.add('active');
  document.getElementById('signupForm').classList.remove('active');
});
document.getElementById('tabSignup').addEventListener('click', () => {
  document.getElementById('tabSignup').classList.add('active');
  document.getElementById('tabLogin').classList.remove('active');
  document.getElementById('signupForm').classList.add('active');
  document.getElementById('loginForm').classList.remove('active');
});

/* ========== SIGNUP ========== */
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim().toLowerCase();
  const pass = document.getElementById('signupPass').value;

  if (!name || !email || !pass) {
    setStatus('signupStatus', 'All fields required', 'err');
    shakeCard();
    return;
  }
  if (pass.length < 6) {
    setStatus('signupStatus', 'Password must be 6+ characters', 'err');
    shakeCard();
    return;
  }

  const users = getUsers();
  if (users.find(u => u.email === email)) {
    setStatus('signupStatus', 'Email already registered', 'err');
    shakeCard();
    return;
  }

  setStatus('signupStatus', 'Creating your account...', '');
  await sleep(700);

  const trialStart = Date.now();
  const trialEnd = trialStart + (TRIAL_DAYS * 24 * 60 * 60 * 1000);

  const newUser = {
    name, email, password: pass,
    createdAt: trialStart,
    trialStart, trialEnd,
    token: generateToken(),
  };

  users.push(newUser);
  saveUsers(users);

  localStorage.setItem(SESSION_KEY, JSON.stringify({
    email: newUser.email,
    name: newUser.name,
    token: newUser.token,
    loginAt: Date.now(),
  }));

  setStatus('signupStatus', 'Account created! Redirecting...', 'ok');
  await sleep(900);
  window.location.href = 'app.html';
});

/* ========== LOGIN ========== */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;

  if (!email || !pass) {
    setStatus('loginStatus', 'Enter email and password', 'err');
    shakeCard();
    return;
  }

  setStatus('loginStatus', 'Authenticating...', '');
  await sleep(700);

  const users = getUsers();
  const user = users.find(u => u.email === email && u.password === pass);

  if (!user) {
    setStatus('loginStatus', 'Invalid credentials', 'err');
    shakeCard();
    return;
  }

  localStorage.setItem(SESSION_KEY, JSON.stringify({
    email: user.email,
    name: user.name,
    token: user.token,
    loginAt: Date.now(),
  }));

  setStatus('loginStatus', 'Welcome back, ' + user.name + '!', 'ok');
  await sleep(700);
  window.location.href = 'app.html';
});

/* ========== AUTO REDIRECT IF LOGGED IN ========== */
(function autoRedirect() {
  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    if (s && s.token) window.location.replace('app.html');
  } catch(_) {}
})();
</script>
</body>
</html>
